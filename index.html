
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Licorería</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #202735;
    }
    header {
      background: #172b4d;
      color: white;
      padding: 24px 18px;
      text-align: center;
    }
    main {
      max-width: 600px;
      margin: 20px auto;
      padding: 16px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px #00000012;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      border: 1px solid #ccd2dc;
    }
    button {
      background: #176b50;
      color: white;
      border: none;
      font-weight: bold;
    }
    .item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍾 Mi Licorería</h1>
    <p>Control de inventario y productos</p>
  </header>

  <main>
    <section class="card">
      <h2>Agregar producto</h2>
      <input id="nombre" placeholder="Nombre del producto">
      <input id="cantidad" type="number" min="0" placeholder="Cantidad inicial">
      <input id="precio" type="number" min="0" step="0.01" placeholder="Precio de venta ($)">
      <button onclick="agregar()">Guardar producto</button>
    </section>

    <section class="card">
      <h2>Mi inventario</h2>
      <div id="inventario">Todavía no hay productos.</div>
    </section>
  </main>

  <script>
    let productos = [];

    function mostrar() {
      const lista = document.getElementById("inventario");
      if (productos.length === 0) {
        lista.textContent = "Todavía no hay productos.";
        return;
      }

      lista.innerHTML = "";
      productos.forEach(p => {
        const item = document.createElement("div");
        item.className = "item";
        item.textContent =
          p.nombre + " — Cantidad: " + p.cantidad +
          " — Precio: $" + p.precio.toFixed(2);
        lista.appendChild(item);
      });
    }

    function agregar() {
      const nombre = document.getElementById("nombre").value.trim();
      const cantidad = Number(document.getElementById("cantidad").value);
      const precio = Number(document.getElementById("precio").value);

      if (!nombre ||
          document.getElementById("cantidad").value === "" ||
          document.getElementById("precio").value === "" ||
          cantidad < 0 || precio < 0) {
        alert("Completa todos los campos con valores válidos.");
        return;
      }

      productos.push({ nombre, cantidad, precio });
      document.getElementById("nombre").value = "";
      document.getElementById("cantidad").value = "";
      document.getElementById("precio").value = "";
      mostrar();
    }
  </script>
</body>
</html>
